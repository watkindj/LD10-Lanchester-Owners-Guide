
workflows:
  ld10-ios-build:
    name: LD10 iOS build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Check project
        script: |
          ls -la
          ls -la LD10_iOS_Project
          test -d LD10_iOS_Project/LD10.xcodeproj

      - name: Build LD10 for iOS Simulator
        script: |
          xcodebuild \
            -project LD10_iOS_Project/LD10.xcodeproj \
            -scheme LD10 \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
