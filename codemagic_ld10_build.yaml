workflows:
  ld10-ios-build:
    name: LD10 iOS simulator build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Check project and build LD10
        script: |
          set -e
          echo "Checking repository layout..."
          ls -la
          PROJECT="LD10_iOS_Project/LD10.xcodeproj"
          PBXPROJ="$PROJECT/project.pbxproj"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: Expected Xcode project folder not found: $PROJECT"
            find . -maxdepth 6 -type d -name "*.xcodeproj" -print
            exit 1
          fi

          if [ ! -f "$PBXPROJ" ]; then
            echo "ERROR: project.pbxproj not found at $PBXPROJ"
            find . -maxdepth 7 -name "project.pbxproj" -print
            exit 1
          fi

          echo "Xcode version:"
          xcodebuild -version

          echo "Reading project and available schemes..."
          xcodebuild -list -project "$PROJECT"

          echo "Building iOS Simulator app..."
          xcodebuild \
            -project "$PROJECT" \
            -scheme LD10 \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - build/DerivedData/Logs/Build/*.xcactivitylog
