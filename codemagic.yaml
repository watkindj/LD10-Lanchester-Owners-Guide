
workflows:
  ld10-ios-build:
    name: LD10 iPhone Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Check project
        script: |
          ls -la
          test -d LD10_iOS_Project/LD10.xcodeproj
          plutil -lint LD10_iOS_Project/LD10.xcodeproj/project.pbxproj
          xcodebuild -list -project LD10_iOS_Project/LD10.xcodeproj

      - name: Build LD10 for iPhone
        script: |
          xcodebuild \
            -project LD10_iOS_Project/LD10.xcodeproj \
            -scheme LD10 \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/DerivedData/Build/Products/Release-iphoneos/*.app
