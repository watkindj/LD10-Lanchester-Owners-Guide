workflows:
  ld10-ios-build:
    name: LD10 iOS build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Locate and build LD10 iOS project
        script: |
          echo "Repository checkout:"
          pwd
          echo "Top-level files:"
          ls -la
          echo "Searching for Xcode project:"
          find . -maxdepth 6 -type d -name "*.xcodeproj" -print
          PROJECT_PATH="$(find . -maxdepth 6 -type d -name "LD10.xcodeproj" -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: LD10.xcodeproj was not found in this checkout."
            echo "Project-related files:"
            find . -maxdepth 6 \( -name "project.pbxproj" -o -name "LD10App.swift" -o -name "HomeView.swift" \) -print
            exit 1
          fi
          echo "Using project: $PROJECT_PATH"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme LD10 \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
