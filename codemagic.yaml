
workflows:
  ld10-ios-build:
    name: LD10 iPhone Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: 27.2

    scripts:
      - name: Check project
        script: |
          ls -la
          test -d LD10_iOS_Project/LD10.xcodeproj
          plutil -lint LD10_iOS_Project/LD10.xcodeproj/project.pbxproj
          xcodebuild -list -project LD10_iOS_Project/LD10.xcodeproj

      - name: Build LD10 for iPhone
        script: |
          xcodebuild \
            -project LD10_iOS_Project/LD10.xcodeproj \
            -scheme LD10 \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/DerivedData/Build/Products/Release-iphoneos/*.app

      

  ld10-ios-simulator-preview:
    name: LD10 Simulator Preview
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: 27.2

    scripts:
      - name: Build for iPhone Simulator
        script: |
          xcodebuild \
            -project LD10_iOS_Project/LD10.xcodeproj \
            -scheme LD10 \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=uk.co.ld10.ownersguide \
            build


      - name: Launch LD10 and capture screenshot
        script: |
          set -e

          SIMULATOR_UDID=$(xcrun simctl list devices available | grep -m 1 -E 'iPhone.*\([A-F0-9-]{36}\)' | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')

          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi

          APP_PATH=$(find build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          APP_PATH="$(cd "$(dirname "$APP_PATH")" && pwd)/$(basename "$APP_PATH")"
          echo "APP PATH: $APP_PATH"

          BUNDLE_ID="uk.co.ld10.ownersguide"

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "App Info.plist is missing"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP_PATH/Info.plist" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $BUNDLE_ID" "$APP_PATH/Info.plist"

          echo "CHECKING APP INFO.PLIST"
          plutil -p "$APP_PATH/Info.plist"

          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl launch "$SIMULATOR_UDID" "$BUNDLE_ID"

          sleep 45

          mkdir -p build/Preview
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/Preview/LD10-Preview.png


    artifacts:
      - build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/*.app
      - build/Preview/LD10-Preview.png
